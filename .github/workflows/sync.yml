name: Sync Beehive catalog

on:
  schedule:
    # Daily 16:00 UTC ≈ 00:00 HKT
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync catalog from Beehive
        run: node scripts/sync.mjs

      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          if git diff --staged --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: sync Beehive card prices"
            git push
          fi
