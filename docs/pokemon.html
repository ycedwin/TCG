<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2747" />
    <meta name="description" content="Pokemon JP card buy price checker" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i0.wp.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=66" />
    <title>PKM JP</title>
  </head>
  <body class="theme-pkm">
    <div class="bg" aria-hidden="true"></div>
    <header class="top">
      <nav class="game-nav" aria-label="Game">
        <a class="game-tab" href="./">One Piece</a>
        <a class="game-tab is-active" href="./pokemon.html" aria-current="page">Pokémon JP</a>
      </nav>
      <div class="status-row">
        <div class="status" id="status" role="status">Loading…</div>
        <button type="button" class="refresh-btn" id="refresh" title="Reload Beehive snapshot + live Hareruya (~8 MB)">Reload prices</button>
      </div>
    </header>

    <main class="shell">
      <section class="controls" aria-label="Search">
        <div class="search-row">
          <label class="field search-field">
            <span>Search</span>
            <input
              id="search"
              type="search"
              enterkeyhint="search"
              placeholder="Set, number, or name (e.g. Pikachu, M5 111)"
              autocomplete="off"
            />
          </label>
          <button
            type="button"
            class="price-toggle"
            id="priceToggle"
            aria-expanded="false"
            aria-controls="priceFilters"
            title="Price filters"
          >
            $
          </button>
        </div>
        <div id="priceFilters" class="price-filters" aria-label="Price filters" hidden>
          <label class="field">
            <span>Buy min</span>
            <input id="buyMin" type="number" min="0" step="1" inputmode="numeric" placeholder="—" />
          </label>
          <label class="field">
            <span>Buy max</span>
            <input id="buyMax" type="number" min="0" step="1" inputmode="numeric" placeholder="—" />
          </label>
        </div>
        <div class="rarity-filters" id="rarityFilters" role="group" aria-label="Rarity">
          <button type="button" class="rarity-chip is-active" data-bucket="">All</button>
          <button type="button" class="rarity-chip" data-bucket="special">Special</button>
          <button type="button" class="rarity-chip" data-bucket="high">RR+</button>
          <button type="button" class="rarity-chip" data-bucket="other">Other</button>
        </div>
      </section>

      <p class="meta" id="meta"></p>
      <div id="results" class="results" aria-live="polite"></div>
    </main>

    <footer class="foot">
      <p>Buy: Beehive (HKD) + Hareruya / Card Rush (JPY) · tap art to enlarge</p>
    </footer>

    <button type="button" class="back-top" id="backTop" aria-label="Back to top" hidden>↑</button>

    <div id="lightbox" class="lightbox" hidden>
      <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Card art">
        <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
        <img id="lightboxImg" alt="" />
        <p id="lightboxCap" class="lightbox-cap"></p>
      </div>
    </div>

    <script type="module" src="./pokemon.js?v=54"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
