<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1e33" />
    <meta name="description" content="One Piece card price checker (Beehive TCG)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>One Piece Price Checker</title>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <p class="brand-mark">OP Prices</p>
        <h1>Card price checker</h1>
        <p class="tagline">Source: Beehive TCG · HKD</p>
      </div>
      <div class="status-row">
        <div class="status" id="status" role="status">Loading…</div>
        <button type="button" class="refresh-btn" id="refresh">Refresh prices</button>
      </div>
    </header>

    <main class="shell">
      <section class="controls" aria-label="Search and filters">
        <label class="field search-field">
          <span>Search</span>
          <input
            id="search"
            type="search"
            enterkeyhint="search"
            placeholder="Card number (e.g. OP16-065 or 065)"
            autocomplete="off"
          />
        </label>
        <label class="field">
          <span>Set</span>
          <select id="setSelect">
            <option value="">All sets</option>
          </select>
        </label>
        <label class="field">
          <span>Sort</span>
          <select id="sortSelect">
            <option value="number">Card number</option>
            <option value="price-asc">Price: low → high</option>
            <option value="price-desc">Price: high → low</option>
          </select>
        </label>
      </section>

      <p class="meta" id="meta"></p>
      <div id="results" class="results" aria-live="polite"></div>
    </main>

    <footer class="foot">
      <p>Prices from Beehive · tap Refresh to sync · offline uses local cache</p>
    </footer>

    <script type="module" src="./main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
